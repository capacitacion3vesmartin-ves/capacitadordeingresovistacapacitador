function mallaExtractDays(model){
  const rows=[...model.rows.entries()].sort((a,b)=>a[0]-b[0]);
  let dayRow=-1,dayCols={};
  for(const [ri,cells] of rows){
    const found={};
    for(const c of cells){
      const n=mallaNorm(c.value).replace(/^\s+/,'');
      const m=n.match(/^dia\s*(\d+)$/i);
      if(m&&+m[1]>=1&&+m[1]<=31)found[+m[1]]=c.col;
    }
    if(Object.keys(found).length>=3){dayRow=ri;dayCols=found;break}
  }
  if(dayRow<0)throw new Error('No se encontró la fila de días de la Malla');

  const maxRow=rows.length?rows[rows.length-1][0]:dayRow;
  const get=(ri,col)=>{const rr=model.rows.get(ri)||[];return rr.find(c=>c.col===col)||null};
  const out=DAYS.map((name,i)=>({name,levelBg:'',dayBg:'',headerBg:'',headerText:name,items:[]}));

  for(let i=0;i<DAYS.length;i++){
    const col=dayCols[i+1];
    if(!col)continue;
    // Keep the day title fixed from the app; pull only the actual cell contents below the day row.
    for(let r=dayRow+1;r<=maxRow;r++){
      const c=get(r,col);
      if(!c||!mallaNorm(c.value))continue;
      const n=mallaNorm(c.value);
      // Ignore obvious structural labels; everything else is a real topic and its full text is preserved.
      if(/^(dia\s*\d+|basico|intermedio|avanzado|nivel\s+)/i.test(n))continue;
      out[i].items.push({text:String(c.value),bg:c.bg||'',fg:mallaContrast(c.bg||'')});
    }
  }
  return out;
}

/* ===== Bloqueo del registro (pausa): clave + PIN, para cualquier usuario ===== */
const BCL='Martin123+',BPIN='050493';let BE=0,BT=0;
const blqBox=h=>{const o=$('#blq');o.innerHTML=`<div class="lgc"><div class="blk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC.lock}"/></svg></div><h1>Registro en pausa</h1>${h}</div>`;o.style.display='flex';$('#app').inert=true;$('#md').inert=true};
function BLQ(){if(!AU)return;if(!confirm('¿Deseas bloquear el registro ahora?'))return;try{sessionStorage.setItem('cap_blq','1')}catch(e){}$('#md').style.display='none';BLC()}
function BLC(){blqBox(`<p class="lgs">Ingrese clave para continuar</p><div class="lgf" style="--c:#374151"><label>Clave<div class="pw" style="position:relative"><input id="bkp" type="password" autocomplete="off" placeholder="Clave" onkeydown="if(event.key=='Enter')BLK()"><button type="button" class="lge" onclick="const i=$('#bkp');i.type=i.type=='password'?'text':'password'">Ver</button></div></label><div id="bkm" class="lgm"></div><div class="lgx"><button class="b bg" onclick="BLK()">Continuar</button></div></div>`);setTimeout(()=>{const x=$('#bkp');if(x)x.focus()},60)}
function BF(t,c){const m=$('#bkm');if(c!==false){BE++;if(BE>=5){BT=Date.now()+30000;BE=0;t='Demasiados intentos. Espera 30 segundos.'}}m.textContent=t;m.classList.remove('sh');void m.offsetWidth;m.classList.add('sh')}
const BW=()=>{if(Date.now()<BT){BF('Espera '+Math.ceil((BT-Date.now())/1000)+' segundos e intenta de nuevo.',false);return true}return false};
function BLK(){if(BW())return;const v=$('#bkp').value.trim();if(v!=BCL){BF('Clave incorrecta. Inténtalo de nuevo.');$('#bkp').select();return}BE=0;BLP()}
function BLP(){blqBox(`<p class="lgs">Ahora ingrese su PIN</p><div class="lgf" style="--c:#374151"><div class="lgpin">`+[0,1,2,3,4,5].map(i=>`<input id="bq${i}" type="password" inputmode="numeric" maxlength="1" autocomplete="off" oninput="BD(${i})" onkeydown="BB(event,${i})">`).join('')+`</div><div id="bkm" class="lgm"></div><div class="lgx"><button class="b bu" onclick="BLC()">Volver</button><button class="b bg" onclick="BV()">Desbloquear</button></div></div>`);setTimeout(()=>{const x=$('#bq0');if(x)x.focus()},60)}
function BD(i){const x=$('#bq'+i);x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value&&i<5)$('#bq'+(i+1)).focus();if(i==5&&x.value)BV()}
function BB(e,i){if(e.key=='Backspace'&&!$('#bq'+i).value&&i>0)$('#bq'+(i-1)).focus()}
function BV(){if(BW())return;const v=[0,1,2,3,4,5].map(i=>$('#bq'+i).value).join('');
 if(v.length<6){BF('Escribe los 6 dígitos.',false);return}
 if(v!=BPIN){BF('PIN incorrecto.');[0,1,2,3,4,5].forEach(i=>$('#bq'+i).value='');$('#bq0').focus();return}
 BE=0;try{sessionStorage.removeItem('cap_blq')}catch(e){}$('#blq').style.display='none';$('#blq').innerHTML='';$('#app').inert=false;$('#md').inert=false}

const DEFAULT_URL=''; /* opcional: pega aquí tu enlace de Apps Script para no tener que ponerlo en cada navegador */
let rsT=null,PHS={},PHD={},phBusy=false;
const drvMsg=t=>{DRV=t;const e=$('#drv');if(e)e.textContent=t};
const nd=v=>String(v==null?'':v).trim().replace(/^0+/,'');
const phOf=a=>a.ph||PHD[nd(a.d)]||(a.foto?fotoUrl(a.foto):'')||PHS[nd(a.d)]||'';
function urlIn(v){S.url=v.trim();S.vinc=false;try{localStorage.setItem('cap4',JSON.stringify(S))}catch(e){}}

function datosLimpios(){const c=JSON.parse(JSON.stringify(S));c.gs.forEach(g=>g.adv.forEach(a=>{delete a.ph}));return JSON.stringify(c)}
async function enviarResp(){
 if(!S.url)return;
 const txt=datosLimpios(),partes=[];for(let i=0;i<txt.length;i+=40000)partes.push(txt.slice(i,i+40000));
 try{await fetch(S.url,{method:'POST',mode:'no-cors',body:JSON.stringify({accion:'respaldo',t:S.t||Date.now(),partes})});S.vinc=true;drvMsg('Guardado en Drive · '+new Date().toTimeString().slice(0,5))}
 catch(e){drvMsg('No se pudo guardar en Drive. Revisa el enlace.')}}
async function cargarDrive(){
 if(!S.url)return;
 try{
  const r=await fetch(S.url+(S.url.includes('?')?'&':'?')+'accion=datos&_='+Date.now(),{cache:'no-store'}),j=await r.json();
  let N=null;if(j.ok&&j.datos){try{N=JSON.parse(j.datos)}catch(e){}}
  if(!N||N.gen!==GEN){S.vinc=true;enviarResp();return} /* Drive vacío o con datos de una versión anterior: empieza limpio */
  const tr=+j.t||0;
  if(tr<=(S.t||0)){S.vinc=true;if(tr<(S.t||0))enviarResp();else drvMsg('Conectado con Drive · todo se guarda solo');return}
  const old={};S.gs.forEach(g=>g.adv.forEach(a=>{if(a.ph)old[g.id+'|'+a.d]=a.ph}));
  N.gs.forEach(g=>g.adv.forEach(a=>{const p=old[g.id+'|'+a.d];if(p)a.ph=p}));
  N.url=S.url;N.t=tr;N.vinc=true;S=N;migrar();aplicaAU();
  try{localStorage.setItem('cap4',JSON.stringify(S))}catch(e){}
  S.cur=cg().id;R();drvMsg('Datos al día desde Drive')
 }catch(e){drvMsg('No se pudo conectar con Drive. Revisa el enlace.');console.warn('Drive:',e)}}
function delGrupo(id){
 const g=S.gs.find(x=>x.id==id);if(!g)return;
 if(S.gs.filter(x=>x.sede==g.sede).length<2){alert('No puedes eliminar el único grupo de esta sede. Crea otro primero.');return}
 const n=g.adv.length;
 if(!confirm('⚠️ ELIMINAR GRUPO\n\n«'+g.name+'» tiene '+n+' asesor'+(n==1?'':'es')+' con sus notas, puntos, puntualidad y reportes.\nEsto NO se puede deshacer.\n\n¿Quieres continuar?'))return;
 const t=prompt('Para confirmar, escribe el nombre exacto del grupo:\n\n'+g.name);
 if(t===null)return;
 if(t.trim()!==g.name.trim()){alert('El nombre no coincide. No se eliminó nada.');return}
 S.gs=S.gs.filter(x=>x.id!=id);
 ['rep','pun','pt','fm'].forEach(k=>{if(S[k])Object.keys(S[k]).forEach(key=>{if(key.startsWith(id)&&/^\d{4}-\d{2}-\d{2}$/.test(key.slice(id.length)))delete S[k][key]})});
 if(S.cur==id)S.cur=S.gs.filter(x=>x.sede==g.sede).sort((a,b)=>b.start>a.start?1:-1)[0].id;
 S.rd=null;S.sa=null;
 save({campo:'Grupo eliminado',valor:g.name,grupo:g.name});R()}

function csvRows(t){const o=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'){r.push(c);o.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c!==''||r.length){r.push(c);o.push(r)}return o}
function urlToData(u){const uno=src=>new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';
 im.onload=()=>{try{const W=240,H=280,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d'),k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;cx.drawImage(im,(W-w)/2,(H-h)/2,w,h);res(cv.toDataURL('image/jpeg',.82))}catch(e){res('')}};
 im.onerror=()=>res('');im.src=src});
 return uno(u).then(v=>v||uno('https://images.weserv.nl/?url='+encodeURIComponent(u)+'&w=240&h=280&fit=cover&output=jpg'))}

   if(['asr','sug'].includes(tab))R();

 }catch(e){console.warn('Fotos:',e)}finally{phBusy=false}}
if(!S.url)S.url=DEFAULT_URL||''
migrar();if(AU)aplicaAU();else S.master=false;S.cur=cg().id;{const i=tIdx(ymd(new Date()));if(i>=0)mi=modOf(DT(i))}R();if(!AU)LGR();else{try{if(sessionStorage.getItem('cap_blq'))BLC()}catch(e){}}
