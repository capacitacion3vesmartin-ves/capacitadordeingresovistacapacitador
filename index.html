<style>
:root{--g:#0a8f2a;--gd:#06621c;--o:#f58a07;--r:#e11d48;--b:#2563eb;--p:#7c3aed;--bd:#d6e6da;--mu:#4f6355;--tx:#10201a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:#f1f9f4;color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,Arial,sans-serif}
#app{display:flex;min-height:100vh}#mn{flex:1;min-width:0}
aside{width:210px;background:#fff;border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex:none}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 16px;font-weight:800;color:var(--gd);line-height:1.1}
.lg{width:40px;height:38px;flex:none}#tl{display:none}#tl .lg{width:32px;height:30px}
aside button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;font:600 14px inherit;color:var(--mu);cursor:pointer;text-align:left}
aside button:hover{background:#e9f6ec}aside button.on{background:var(--g);color:#fff}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:19px}.top small{color:var(--mu)}.top>div{flex:1}
.back{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;color:var(--gd);cursor:pointer}
main{padding:20px 22px 40px;max-width:1150px}
select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fff;color:var(--tx)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(10,60,30,.06)}
.hero{display:flex;overflow:hidden;padding:0}.hb{width:10px;flex:none}.hero>div:last-child{padding:18px;flex:1}.hero h1{margin:2px 0 6px;font-size:28px}.hero small{color:var(--mu)}
.pg{height:8px;background:#e1efe5;border-radius:6px;margin-top:10px}.pg b{display:block;height:100%;border-radius:6px;background:var(--g)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.k{background:#fff;border:1px solid var(--bd);border-top:4px solid var(--c,var(--g));border-radius:14px;padding:12px 14px}.k small{color:var(--mu);font-weight:600}.k b{display:block;font-size:28px;color:var(--c,var(--g))}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ac{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;text-align:left;box-shadow:0 1px 3px rgba(10,60,30,.06);transition:.15s}.ac:hover{transform:translateY(-2px);border-color:var(--c)}
.ac i{width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}.ac b{display:block;font-size:15px}.ac small{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}.chips button{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;color:var(--mu);white-space:nowrap;cursor:pointer}.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #e7f1ea}.row:last-child{border:0}.row .nm{flex:1;min-width:180px}.nm b{display:block;font-size:13px}.nm small{color:var(--mu)}
.av{width:36px;height:36px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.pill{border-radius:20px;padding:4px 12px;font-weight:800;font-size:12px;background:#e1efe5}.pl{background:#d3f5da;color:var(--gd)}.pr{background:#ffd9e0;color:var(--r)}.pc{background:#d8f1ff;color:#0369a1}
.b{border:0;border-radius:10px;padding:9px 14px;color:#fff;cursor:pointer;font-weight:700}.bg{background:var(--g)}.br{background:var(--r)}.bo{background:var(--o)}.bu{background:#fff;color:var(--mu);border:1px solid var(--bd)}
.seg{display:flex;gap:6px}.seg .b{padding:11px 14px;background:#fff;border:2px solid var(--c);color:var(--c)}.seg .b.on{background:var(--c);color:#fff}
.sc{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:16px;margin-bottom:16px}
